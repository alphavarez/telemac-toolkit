name: tests

on:
  push:
  pull_request:

jobs:
  core:
    # the pure-Python libraries (SELAFIN, mesher, calculator, writers); the QGIS tests run locally
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy pytest meshio
      - run: python -m pytest -q tests/core
